version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rajmail_api
    command: python main.py api
    volumes:
      - .:/app
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rajmail_worker
    command: celery -A app.queue_worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rajmail_scheduler
    command: celery -A app.queue_worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rajmail_redis
    ports:
      - "6379:6379"

volumes:
  downloads:
  logs:
